name: Build and Release Portable Application

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: 3.9.6  # 使用嵌入式Python版本
  ARIA2_VERSION: 1.37.0
  APP_NAME: "LCTA"
  PYINSTALLER_ARGU: "--add-data \"LCTA_backup/config_default.json;.\" --add-data \"LCTA_backup/config_check.json;.\" --add-data \"LCTA_backup/webui;webui\" -i \"LCTA_backup/favicon.ico\""

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        path: LCTA

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        cache: 'pip'

    - name: Init code for release
      run: |
        python -m pip install requests rjsmin rcssmin
        python .\LCTA\.github\InitCode.py
      env:
        PYTHONIOENCODING: utf-8        
    - name: setup-path
      run: |
        Copy-Item -Path .\LCTA -Destination .\LCTA_backup -Recurse
        Copy-Item -Path .\LCTA -Destination .\LCTA_update -Recurse
        mkdir release
        mkdir release/${{ env.APP_NAME }}
        mkdir release/${{ env.APP_NAME }}/code
    
    - name: Setup MSYS2 and MinGW (for C compilation)
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: >-
          mingw-w64-x86_64-toolchain
    
    - name: Compile C launcher
      run: |
        # 使用现有的favicon.ico作为图标
        Copy-Item .\LCTA_backup\favicon.ico .\launcher.ico
        
        # 创建资源文件
        echo "1 ICON \"launcher.ico\"" > launcher.rc
        # 编译资源文件为目标文件
        windres launcher.rc -o launcher_res.o
        
        # 编译C启动器并链接图标资源
        # -mwindows: 编译为GUI子系统，双击启动时不显示控制台窗口
        gcc -O2 -mwindows -o launcher.exe launcher.c launcher_res.o -lshlwapi
        strip launcher.exe
        mv launcher.exe release\${{ env.APP_NAME }}\launcher.exe

        gcc -O2 -mwindows -o launcher_debug.exe launcher_debug.c launcher_res.o -lshlwapi
        strip launcher_debug.exe
        mv launcher_debug.exe release\${{ env.APP_NAME }}\launcher_debug.exe

    - name: Install Dependencies
      run: |
        python -m venv venv
        .\venv\Scripts\activate
        python -m pip install pip --upgrade
        pip install -r LCTA\requirements.txt
        python -c "from pathlib import Path;session=Path(r'venv\Lib\site-packages\requests\sessions.py');
        session.write_text(session.read_text(encoding='utf-8').replace('verify=None,', 'verify=False,'),encoding='utf-8')"
    - name: Install Embedded Python
      run: |
        Invoke-WebRequest -Uri https://www.python.org/ftp/python/${{ env.PYTHON_VERSION }}/python-${{ env.PYTHON_VERSION }}-embed-amd64.zip -OutFile ../python.zip
        New-Item -ItemType Directory -Path venv/Bins
        Expand-Archive -Path ../python.zip -DestinationPath venv/Bins
        Add-Content -Path venv/Bins/*._pth -Value "import site"
    
    - name: copy files
      run: |
        dir LCTA -Recurse
        dir release -Recurse
        Copy-Item LCTA\* release\${{ env.APP_NAME }}\code\ -Recurse -Force
        Copy-Item venv release\${{ env.APP_NAME }}\code\venv -Recurse

    - name: Bundle rawinput hook DLL (input bypass)
      run: |
        $targets = @(
            "release\${{ env.APP_NAME }}\code\hooks",
            ".\LCTA_update\hooks"
        )
        foreach ($target in $targets) {
            New-Item -ItemType Directory -Path $target -Force | Out-Null
        }
        gcc -shared -O2 -s -static-libgcc -o rawinput_hook.dll LCTA/hooks/rawinput_hook.c -lpsapi
        Copy-Item rawinput_hook.dll "release\${{ env.APP_NAME }}\code\hooks\rawinput_hook.dll" -Force
        Copy-Item rawinput_hook.dll ".\LCTA_update\hooks\rawinput_hook.dll" -Force

    - name: Fetch & bundle Cheat Core (toolbox, private + encrypted)
      run: |
        # 克隆私有仓库（源码 + MinHook + XOR 密钥），逐个编译 hooks/*.c 后加密打包。
        # 新增作弊工具 = 私有仓库新增 .c 源，此处自动编译（与 build.ps1 命令保持一致）
        git clone https://x-access-token:${{ secrets.LCTA_CHEAT_TOKEN }}@github.com/HZBHZB1234/LCTA_CheatingCore.git cheat_core
        foreach ($c in (Get-ChildItem cheat_core\hooks -Filter *.c | Sort-Object Name)) {
            $dll = [System.IO.Path]::ChangeExtension($c.FullName, ".dll")
            Write-Host "Compiling $($c.Name) -> $([System.IO.Path]::GetFileName($dll))"
            gcc -shared -O2 -s -static-libgcc -o $dll $c.FullName `
                cheat_core/vendor/minhook/src/hook.c `
                cheat_core/vendor/minhook/src/buffer.c `
                cheat_core/vendor/minhook/src/trampoline.c `
                cheat_core/vendor/minhook/src/hde/hde64.c `
                -I cheat_core/vendor/minhook/include -I cheat_core/vendor/minhook/src/hde
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
        python LCTA\scripts\cheat_encrypt.py build --src cheat_core --key cheat_core/keys/current.txt --out cheat_core.bin
        $targets = @(
            "release\${{ env.APP_NAME }}\code\cheat_core",
            ".\LCTA_update\cheat_core"
        )
        foreach ($target in $targets) {
            New-Item -ItemType Directory -Path $target -Force | Out-Null
            Copy-Item cheat_core.bin "$target\cheat_core.bin" -Force
        }

    - name: Copy CFST directory to tools/cfst (CDN optimization)
      run: |
        if (Test-Path .\LCTA\tools\cfst) {
            # 先删除目标再复制，避免 Copy-Item 在目标已存在时将源文件夹嵌套复制
            # （copy files 步骤中 LCTA\* 可能已复制了 tools\cfst，此处必须清理旧目标）
            $targets = @(
                "release\${{ env.APP_NAME }}\code\tools\cfst",
                ".\LCTA_update\tools\cfst"
            )
            foreach ($t in $targets) {
                if (Test-Path $t) { Remove-Item $t -Recurse -Force }
                New-Item -ItemType Directory -Path (Split-Path $t) -Force | Out-Null
                Copy-Item .\LCTA\tools\cfst $t -Recurse -Force
            }
            Write-Host "tools/cfst/ copied to release artifacts"
        } else {
            Write-Host "WARNING: tools/cfst/ directory not found, skipping"
        }

    - name: Bundle aria2c (official resource updater)
      run: |
        $archive = ".\aria2.zip"
        $extract = ".\aria2-extract"
        $url = "https://github.com/aria2/aria2/releases/download/release-${{ env.ARIA2_VERSION }}/aria2-${{ env.ARIA2_VERSION }}-win-64bit-build1.zip"
        for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
                Invoke-WebRequest -Uri $url -OutFile $archive
                if ((Get-Item $archive).Length -lt 1000000) { throw "aria2 archive size is invalid" }
                break
            } catch {
                Remove-Item $archive -Force -ErrorAction SilentlyContinue
                if ($attempt -eq 3) { throw }
                Start-Sleep -Seconds (2 * $attempt)
            }
        }
        Expand-Archive -Path $archive -DestinationPath $extract -Force
        $aria2Exe = Get-ChildItem $extract -Recurse -Filter "aria2c.exe" -File | Select-Object -First 1
        if (-not $aria2Exe) { throw "aria2c.exe not found in downloaded archive" }
        $aria2License = Get-ChildItem $extract -Recurse -Filter "COPYING" -File | Select-Object -First 1
        $targets = @(
            "release\${{ env.APP_NAME }}\code\tools\aria2",
            ".\LCTA_update\tools\aria2"
        )
        foreach ($target in $targets) {
            New-Item -ItemType Directory -Path $target -Force | Out-Null
            Copy-Item $aria2Exe.FullName "$target\aria2c.exe" -Force
            if ($aria2License) { Copy-Item $aria2License.FullName "$target\COPYING" -Force }
        }

    - name: Upload portable application folder
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APP_NAME }}-Portable-Full
        path: |
          release/${{ env.APP_NAME }}
        retention-days: 7

    - name: Upload update folder
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APP_NAME }}-update
        path: |
          ./LCTA_update
        retention-days: 7

    # 压缩文件夹为ZIP文件
    - name: Create ZIP archives
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        # 压缩便携版完整文件夹
        Compress-Archive -Path release/${{ env.APP_NAME }} -DestinationPath release/${{ env.APP_NAME }}-Portable-Full.zip
        
        # 压缩更新文件夹
        Remove-Item -Path ./LCTA_update/.git -Recurse -Force
        Compress-Archive -Path ./LCTA_update/* -DestinationPath release/${{ env.APP_NAME }}-update.zip

    # 创建 GitHub Release（仅当推送的是 tag 时）
    - name: Create Release on Tag
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        name: LCTA ${{ github.ref_name }}
        body_path: ./update.md
        draft: false
        prerelease: false
        files: |
          release/${{ env.APP_NAME }}-Portable-Full.zip
          release/${{ env.APP_NAME }}-update.zip
        tag_name: ${{ github.ref_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.LCTA_RELEASER }}
