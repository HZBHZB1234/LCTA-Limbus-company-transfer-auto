[package]
name = "lcta-translation-engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "_lcta_native"
crate-type = ["cdylib"]

[dependencies]
crossbeam-channel = "0.5"
pyo3 = { version = "0.22", features = ["abi3-py39", "extension-module"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
walkdir = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
