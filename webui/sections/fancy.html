<div class="section-header">
    <h2 class="section-title">
        <i class="fas fa-paint-brush"></i>
        美化规则
    </h2>
    <p class="section-subtitle">管理文本美化规则集</p>
</div>

<div class="settings-grid" style="grid-template-columns: 1fr 2fr;">
    <div class="setting-card">
        <h3 class="setting-title">规则集列表</h3>
        <div class="form-group">
            <div class="list-container">
                <div class="list-header">
                    <span>规则集名称</span>
                    <span>启用/禁用</span>
                </div>
                <div class="list-content" id="fancy-ruleset-list">
                    <div class="list-empty">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>加载中...</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="button-group">
            <button class="action-btn" onclick="fancyManager.newRuleset()">
                <i class="fas fa-plus"></i> 新建
            </button>
            <button class="action-btn success" onclick="fancyManager.saveAll()">
                <i class="fas fa-save"></i> 保存全部
            </button>
            <button class="action-btn danger" onclick="fancyManager.deleteSelected()">
                <i class="fas fa-trash"></i> 删除
            </button>
            <button class="action-btn success" onclick="applyFancy();">
                <i class="fas fa-play"></i> 立即应用美化
            </button>
            <div class="button-divider"></div>
            <button class="action-btn" onclick="importBusRules()">
                <i class="fas fa-file-import"></i> 导入其他文本替换规则
            </button>
            <button class="action-btn" id="fancy-open-rule-editor-btn" onclick="openRuleEditor()">
                <i class="fas fa-external-link-alt"></i> 打开规则编辑器
            </button>
            <button class="action-btn" onclick="openQuickEditor()">
                <i class="fas fa-pen"></i> 简易翻译编辑器
            </button>
        </div>
    </div>
    
    <div class="setting-card">
        <h3 class="setting-title">规则集编辑器</h3>
        <div class="form-group">
            <label for="fancy-ruleset-name">名称</label>
            <input type="text" id="fancy-ruleset-name" placeholder="规则集名称" disabled>
        </div>
        <div class="form-group">
            <label for="fancy-ruleset-desc">描述</label>
            <input type="text" id="fancy-ruleset-desc" placeholder="规则集描述" disabled>
        </div>
        <div class="form-group">
            <label for="fancy-ruleset-rules">规则 (JSON 格式)</label>
            <textarea id="fancy-ruleset-rules" rows="15" placeholder='[ { "files": ["Skills*.json"], "path": "dataList[*].name", "replacements": [{"from": "旧文本", "to": "新文本"}] } ]' disabled style="font-family: monospace; width: 100%;"></textarea>
        </div>
        <div class="form-group" id="builtinRule" style="display: none;">
            <label>内置规则集（不可编辑）</label>
        </div>
        <div class="button-group">
            <button class="primary-btn" onclick="fancyManager.saveCurrent()" id="fancy-save-current-btn" disabled>
                <i class="fas fa-save"></i> 保存当前
            </button>
            <button class="action-btn" onclick="fancyManager.formatJson()">
                <i class="fas fa-code"></i> 格式化JSON
            </button>
        </div>
    </div>
</div>
