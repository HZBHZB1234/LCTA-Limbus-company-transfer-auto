<div class="disclaimer-overlay" data-risk-overlay="speed" style="display:none;"></div>

<div id="speed-main-content" style="display:none;">
    <div class="section-header">
        <h2 class="section-title">
            <i class="fas fa-forward"></i>
            游戏加速
        </h2>
        <p class="section-subtitle">基于 OpenSpeedy 的游戏速度控制 — 通过 DLL 注入实现变速</p>
        <a href="javascript:void(0)" class="risk-reread-link" onclick="RiskGate.showNoticeModal('speed')">
            <i class="fas fa-exclamation-triangle"></i> 查看风险须知
        </a>
    </div>

    <div class="settings-grid">
        <div class="setting-card">
            <h3 class="setting-title">
                <i class="fas fa-info-circle"></i> 游戏状态
            </h3>
            <div class="speed-status-grid">
                <div class="speed-status-item">
                    <span class="speed-status-label">运行状态:</span>
                    <span id="speed-status-running" class="speed-status-value inactive">○ 未运行</span>
                </div>
                <div class="speed-status-item">
                    <span class="speed-status-label">PID:</span>
                    <span id="speed-status-pid" class="speed-status-value">—</span>
                </div>
                <div class="speed-status-item">
                    <span class="speed-status-label">注入状态:</span>
                    <span id="speed-status-injected" class="speed-status-value inactive">○ 未注入</span>
                </div>
                <div class="speed-status-item">
                    <span class="speed-status-label">当前速度:</span>
                    <span id="speed-status-speed" class="speed-status-value">—</span>
                </div>
            </div>
        </div>

        <div class="setting-card">
            <h3 class="setting-title">
                <i class="fas fa-tachometer-alt"></i> 速度控制
            </h3>
            <div class="form-group">
                <label for="speed-slider">速度倍率</label>
                <div class="speed-slider-group">
                    <span class="speed-label">0.1x</span>
                    <input type="range" id="speed-slider" min="0.1" max="10.0" step="0.1" value="1.0" class="speed-range" disabled>
                    <span class="speed-label">10x</span>
                </div>
            </div>
            <div class="form-group">
                <label for="speed-input">当前倍率</label>
                <div class="speed-input-group">
                    <input type="number" id="speed-input" value="1.0" min="0.1" max="10.0" step="0.1" disabled>
                    <button id="speed-btn-apply" class="action-btn primary">
                        <i class="fas fa-check"></i> 应用
                    </button>
                </div>
            </div>
            <div class="speed-presets">
                <span class="speed-presets-label">快速预设:</span>
                <button class="speed-preset-btn action-btn secondary" data-speed="1">1x</button>
                <button class="speed-preset-btn action-btn secondary" data-speed="2">2x</button>
                <button class="speed-preset-btn action-btn secondary" data-speed="3">3x</button>
                <button class="speed-preset-btn action-btn secondary" data-speed="5">5x</button>
            </div>
            <div style="margin-top: 1rem;">
                <button id="speed-btn-toggle" class="primary-btn">
                    <i class="fas fa-syringe"></i> 注入
                </button>
            </div>
        </div>

        <div class="setting-card">
            <h3 class="setting-title">
                <i class="fas fa-rocket"></i> Launcher 集成
            </h3>
            <p class="form-hint">开启后，通过 Launcher 启动游戏将自动注入加速并注册全局热键：<kbd>Ctrl+S</kbd> 切换加速开关（1x ↔ 设定倍率），<kbd>Ctrl+Shift+S</kbd> 打开倍率选择窗口。</p>
            <p class="form-hint">开关与热键倍率请在 Launcher 配置页的「工作模式」中设置，热键仅在 Launcher 模式下生效。</p>
            <div style="margin-top: 0.5rem;">
                <button type="button" class="action-btn secondary" onclick="goAndShow('launcher-config')">
                    <i class="fas fa-arrow-right"></i> 前往 Launcher 配置
                </button>
            </div>
        </div>
    </div>
</div>
