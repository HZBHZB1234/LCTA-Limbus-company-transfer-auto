<div class="section-header">
    <h2 class="section-title">
        <i class="fas fa-language"></i>
        翻译工具
    </h2>
    <p class="section-subtitle">使用多种翻译服务自动翻译游戏文本</p>
</div>

<div class="settings-grid">
    <div class="setting-card">
        <h3 class="setting-title">翻译选项</h3>

        <div class="form-group">
            <label class="checkbox-container">
                <input type="checkbox" id="enable-proper" onchange="toggleProper()">
                <span class="checkmark"></span>
                启用专有名词 (LLM翻译专用)
            </label>
        </div>

        <div id="proper-settings">
            <div class="form-group">
                <label class="checkbox-container">
                    <input type="checkbox" id="auto-fetch-proper" onchange="toggleAutoProper()">
                    <span class="checkmark"></span>
                    在进行翻译时自动抓取专有词汇 (无法使用自定义设置)
                </label>
            </div>
            
            <div class="form-group" id="proper-path-text">
                <label for="proper-path-text">专有名词json路径</label>
                <div class="file-input-group">
                    <input type="text" id="proper-path" placeholder="选择专有名词json文件">
                    <button class="action-btn secondary" 
                    onclick="pywebview.api.browse_file('proper-path')">
                        <i class="fas fa-folder-open"></i> 浏览
                    </button>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label class="checkbox-container">
                <input type="checkbox" id="enable-role">
                <span class="checkmark"></span>
                启用人物角色标识 (LLM翻译专用)
            </label>
        </div>

        <div class="form-group">
            <label class="checkbox-container">
                <input type="checkbox" id="enable-skill">
                <span class="checkmark"></span>
                启用状态效果标识 (LLM翻译专用)
            </label>
        </div>

        <div class="form-group">
            <label>源文本路径覆盖（通常留空）</label>
            <small class="form-hint">仅在自动定位失败或需要使用自定义语料目录时设置。</small>
        </div>

        <div id="source-path-overrides">
            <div class="form-group" id="kr-path-text">
                <label for="kr-path">韩文文本路径</label>
                <div class="file-input-group">
                    <input type="text" id="kr-path" placeholder="选择韩文文本文件夹">
                    <button class="action-btn secondary" 
                    onclick="pywebview.api.browse_folder('kr-path')">
                        <i class="fas fa-folder-open"></i> 浏览
                    </button>
                </div>
            </div>

            <div class="form-group" id="jp-path-text">
                <label for="jp-path">日文文本路径</label>
                <div class="file-input-group">
                    <input type="text" id="jp-path" placeholder="选择日文文本文件夹">
                    <button class="action-btn secondary"
                     onclick="pywebview.api.browse_folder('jp-path')">
                        <i class="fas fa-folder-open"></i> 浏览
                    </button>
                </div>
            </div>

            <div class="form-group" id="en-path-text">
                <label for="en-path">英文文本路径</label>
                <div class="file-input-group">
                    <input type="text" id="en-path" placeholder="选择英文文本文件夹">
                    <button class="action-btn secondary"
                     onclick="pywebview.api.browse_folder('en-path')">
                        <i class="fas fa-folder-open"></i> 浏览
                    </button>
                </div>
            </div>

            <div class="form-group" id="llc-path-text">
                <label for="llc-path">中文文本路径</label>
                <div class="file-input-group">
                    <input type="text" id="llc-path" placeholder="选择中文文本文件夹">
                    <button class="action-btn secondary"
                     onclick="pywebview.api.browse_folder('llc-path')">
                        <i class="fas fa-folder-open"></i> 浏览
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label class="checkbox-container">
                    <input type="checkbox" id="has-prefix" checked>
                    <span class="checkmark"></span>
                    文件名存在前缀
                </label>
            </div>
        </div>

    </div>
    
    <div class="setting-card">
        <h3 class="setting-title">翻译服务配置</h3>
        <div class="form-group">
            <label for="translation-service">翻译服务:</label>
            <div class="translator-services">
            </div>
        </div>
        <small class="form-hint">Rust 原生引擎会为每个请求分别构造 system prompt 与 user prompt，并自动解析 JSON 响应。</small>
    </div>

    <div class="setting-card">
        <h3 class="setting-title">Rust 原生管线</h3>

        <div class="form-group">
            <label class="checkbox-container">
                <input type="checkbox" id="enable-concurrent" checked>
                <span class="checkmark"></span>
                启用并发处理
            </label>
        </div>

        <div class="form-group">
            <label for="file-concurrency">文件并发数:</label>
            <div class="input-with-icon">
                <i class="fas fa-layer-group"></i>
                <input type="number" id="file-concurrency" placeholder="24" min="1" max="128">
            </div>
        </div>

        <div class="form-group">
            <label for="request-concurrency">网络请求并发数:</label>
            <div class="input-with-icon">
                <i class="fas fa-cloud-arrow-up"></i>
                <input type="number" id="request-concurrency" placeholder="16" min="1" max="128">
            </div>
        </div>

        <div class="form-group">
            <label for="file-io-concurrency">文件 I/O 并发数:</label>
            <div class="input-with-icon">
                <i class="fas fa-hard-drive"></i>
                <input type="number" id="file-io-concurrency" placeholder="32" min="1" max="256">
            </div>
        </div>

        <div class="form-group">
            <label class="checkbox-container">
                <input type="checkbox" id="enable-self-check">
                <span class="checkmark"></span>
                启用翻译自检
            </label>
        </div>

        <div class="form-group">
            <label class="checkbox-container">
                <input type="checkbox" id="enable-thinking">
                <span class="checkmark"></span>
                启用LLM思考模式
            </label>
        </div>

        <div class="form-group">
            <label class="checkbox-container">
                <input type="checkbox" id="enable-rule-validation" checked>
                <span class="checkmark"></span>
                启用规则化后处理校验
            </label>
        </div>

        <div class="form-group">
            <label class="checkbox-container">
                <input type="checkbox" id="dump-translation">
                <span class="checkmark"></span>
                转储过程内容以供分析
            </label>
        </div>
    </div>
</div>

<div class="action-area">
    <button class="primary-btn" onclick="startTranslation()">
        <i class="fas fa-play"></i>
        开始翻译
    </button>
    <button class="action-btn secondary" onclick="pywebview.api.open_translation_log_viewer()">
        <i class="fas fa-file-waveform"></i>
        查看翻译日志
    </button>
</div>
